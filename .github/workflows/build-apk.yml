name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Menggunakan Gradle bawaan sistem karena file ./gradlew tidak ada di proyek Anda
    - name: Build Debug APK with Gradle System
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Warung-Zack-Aplikasi-Jadi
        path: app/build/outputs/apk/debug/*.apk
